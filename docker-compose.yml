services:
  postgres:
    image: postgres:16
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-veriproof}
      - POSTGRES_USER=${POSTGRES_USER:-veriproof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-veriproof}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:

networks:
  default:
    name: ${DOCKER_NETWORK:-google-solana}
