services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:-http://web:8080}
    ports:
      - "${WEB_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  buyer-agent:
    build:
      context: .
      dockerfile: Dockerfile.buyer-agent
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SELLER_AGENT_CARD_URL: ${SELLER_AGENT_CARD_URL:-http://web:8080/.well-known/agent-card.json}
      BUYER_AGENT_PUBLIC_BASE_URL: ${BUYER_AGENT_PUBLIC_BASE_URL:-http://localhost:8001}
    ports:
      - "${BUYER_AGENT_PORT:-8001}:8080"
    depends_on:
      - web

  postgres:
    image: postgres:16
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-veriproof}
      - POSTGRES_USER=${POSTGRES_USER:-veriproof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-veriproof}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:

networks:
  default:
    name: ${DOCKER_NETWORK:-google-solana}
