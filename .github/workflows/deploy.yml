name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
      environment:
        description: "GitHub environment name"
        required: true
        default: "production"
        type: choice
        options:
          - production

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
  WEB_SERVICE: ${{ 'veriproof-web' }}
  BUYER_AGENT_SERVICE: ${{ 'veriproof-buyer-agent' }}

jobs:
  deploy:
    name: Build, deploy, and release
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          CLOUD_RUN_SERVICE_ACCOUNT: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          BUYER_WALLET_SECRET_KEY: ${{ secrets.BUYER_WALLET_SECRET_KEY }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi

          required=(
            GCP_PROJECT_ID
            GCP_REGION
            ARTIFACT_REGISTRY_REPOSITORY
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            CLOUD_RUN_SERVICE_ACCOUNT
            CLOUD_SQL_INSTANCE_CONNECTION_NAME
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_PORT
            GCS_BUCKET
            BUYER_WALLET_SECRET_KEY
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required. Configure it as a GitHub environment or repository variable."
              exit 1
            fi
          done

      - name: Prepare runtime environment files
        id: runtime_env
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          BUYER_WALLET_SECRET_KEY: ${{ secrets.BUYER_WALLET_SECRET_KEY }}
        run: |
          set -euo pipefail

          WEB_RUNTIME_ENV="$RUNNER_TEMP/web.production.env"
          BUYER_RUNTIME_ENV="$RUNNER_TEMP/buyer-agent.production.env"

          cp env.prod "$WEB_RUNTIME_ENV"
          cp env.prod "$BUYER_RUNTIME_ENV"

          append_env() {
            local file="$1"
            local name="$2"
            local value="$3"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '%s="%s"\n' "$name" "$value" >> "$file"
          }

          append_env "$WEB_RUNTIME_ENV" GCP_PROJECT_ID "$GCP_PROJECT_ID"
          append_env "$WEB_RUNTIME_ENV" GCS_BUCKET "$GCS_BUCKET"
          append_env "$WEB_RUNTIME_ENV" POSTGRES_DB "$POSTGRES_DB"
          append_env "$WEB_RUNTIME_ENV" POSTGRES_USER "$POSTGRES_USER"
          append_env "$WEB_RUNTIME_ENV" POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          append_env "$WEB_RUNTIME_ENV" POSTGRES_HOST \
            "/cloudsql/$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
          append_env "$WEB_RUNTIME_ENV" POSTGRES_PORT "$POSTGRES_PORT"

          append_env "$BUYER_RUNTIME_ENV" BUYER_WALLET_SECRET_KEY \
            "$BUYER_WALLET_SECRET_KEY"

          echo "web=$WEB_RUNTIME_ENV" >> "$GITHUB_OUTPUT"
          echo "buyer=$BUYER_RUNTIME_ENV" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-web:${{ github.event.inputs.version }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-web:${{ github.sha }}
          cache-from: type=gha,scope=veriproof-web
          cache-to: type=gha,mode=max,scope=veriproof-web
          provenance: true
          sbom: true

      - name: Run database migrations
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-web:${{ github.event.inputs.version }}
          CLOUD_RUN_SERVICE_ACCOUNT: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          WEB_RUNTIME_ENV: ${{ steps.runtime_env.outputs.web }}
        run: |
          set -euo pipefail

          gcloud run jobs deploy "${WEB_SERVICE}-migrate" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --env-vars-file "$WEB_RUNTIME_ENV" \
            --command python \
            --args manage.py,migrate,--noinput \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --execute-now \
            --wait \
            --quiet

      - name: Deploy web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-web:${{ github.event.inputs.version }}
          flags: >-
            --service-account=${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          env_vars_file: ${{ steps.runtime_env.outputs.web }}

      - name: Build and push buyer agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.buyer-agent
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-buyer-agent:${{ github.event.inputs.version }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-buyer-agent:${{ github.sha }}
          cache-from: type=gha,scope=veriproof-buyer-agent
          cache-to: type=gha,mode=max,scope=veriproof-buyer-agent
          provenance: true
          sbom: true

      - name: Deploy buyer agent to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BUYER_AGENT_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/veriproof-buyer-agent:${{ github.event.inputs.version }}
          env_vars_file: ${{ steps.runtime_env.outputs.buyer }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Deployed $VERSION to ${{ github.event.inputs.environment }}."
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Deployed $VERSION to ${{ github.event.inputs.environment }}."
          fi
